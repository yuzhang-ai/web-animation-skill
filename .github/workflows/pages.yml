name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "templates/**"
      - "scripts/build-site.mjs"
      - "scripts/pages.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The site is docs/ (home, gallery) + templates/ + one generated page per template
      # and language (scripts/build-site.mjs, no npm dependencies).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Assemble site
        run: node scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
