<script>(() => { const r = document.documentElement; let t, l; try { t = localStorage.getItem("theme"); l = localStorage.getItem("lang"); } catch {} r.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); r.lang = l === "zh" ? "zh-CN" : "en"; /* English unless the visitor chose Chinese */ })();</script>

<style>
.head { padding: 64px 0 28px; }
.head h1 { margin: 0; font: 600 clamp(36px, 5vw, 56px)/1.02 var(--font); letter-spacing: -.045em; }
.head p { margin: 14px 0 0; max-width: 36em; color: var(--muted); font-size: 17px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 22px; }
.filters button { height: 34px; padding: 0 14px; border: 0; border-radius: 10px; background: none; color: var(--muted); font: 500 14px var(--font); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); transition: color .2s, background .2s, box-shadow .2s; }
.filters button:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }

/* gallery: big live previews, the name appears on hover */
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.item { position: relative; display: block; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 10; background: #0e0f12; text-decoration: none; color: #eeece6;
        box-shadow: 0 0 0 1px var(--line); transition: box-shadow .35s var(--ease-out), transform .45s var(--ease-out); }
.item[hidden] { display: none; }
.item video, .item img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.item:hover { box-shadow: 0 0 0 1px var(--line-2), 0 30px 60px -36px rgba(0,0,0,.6); transform: translateY(-2px); }
.item .pill { position: absolute; left: 50%; bottom: 14px; translate: -50% 8px; display: inline-flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 12px; white-space: nowrap;
              background: rgba(14,15,18,.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
              font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .3s, translate .45s var(--ease-out); }
.item .pill small { color: #8e9098; font-size: 12.5px; font-weight: 400; }
.item .pill i { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; background: rgba(255,255,255,.1); font-style: normal; }
.item:hover .pill, .item:focus-visible .pill { opacity: 1; translate: -50% 0; }
@media (hover: none) { .item .pill { opacity: 1; translate: -50% 0; } }
.item.wide { grid-column: span 2; aspect-ratio: 16 / 7; }
@media (max-width: 760px) { .gallery { grid-template-columns: 1fr; } .item.wide { grid-column: span 1; aspect-ratio: 16 / 10; } }

/* everything, by stack */
.all { margin-top: 96px; }
.all h2 { margin: 0 0 6px; font: 600 28px/1.1 var(--font); letter-spacing: -.035em; }
.all > p { margin: 0 0 28px; color: var(--muted); }
.stacks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px 24px; }
.stack h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--dim); scroll-margin-top: 80px; }
.stack a { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14.5px; }
.stack a span { color: var(--dim); font-size: 12.5px; }
.stack a:hover { color: var(--accent-ink); }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="index.html"><span class="mark"><i></i></span>web-animation</a>
  <nav class="links">
    <a class="text" href="templates.html" aria-current="page" data-i18n="nav.templates">Templates</a>
    <a class="text hide-sm" href="https://github.com/yuzhang-ai/web-animation-skill/blob/master/spec/motion.md" data-i18n="nav.spec">Motion spec</a>
    <button class="icon-btn lang-toggle" type="button" aria-label="切换到简体中文"><span class="label">中</span></button>
    <button class="icon-btn theme-toggle" type="button" aria-label="Switch light / dark theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <a class="icon-btn" href="https://github.com/yuzhang-ai/web-animation-skill" aria-label="GitHub repository"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
  </nav>
</div></header>

<main class="wrap">
  <header class="head">
    <h1 data-i18n="gallery.title">Templates</h1>
    <p data-i18n="gallery.lede">Hand-picked, running live. Open one for its prompt, code and how to adapt it.</p>
  </header>
  <div class="filters" id="filters" role="group" aria-label="Filter by stack"></div>
  <div class="gallery" id="gallery"></div>

  <section class="all" id="all">
    <h2 data-i18n="gallery.everything">Every template</h2>
    <p id="count"></p>
    <div class="stacks" id="stacks"></div>
  </section>
</main>

<footer class="foot"><div class="wrap">
  <span data-i18n="foot.checked">MIT licensed · Every template is checked in a real browser</span>
  <nav><a href="index.html" data-i18n="foot.home">Home</a><a href="https://github.com/yuzhang-ai/web-animation-skill/blob/master/spec/motion.md" data-i18n="foot.spec">Motion spec</a><a href="https://github.com/yuzhang-ai/web-animation-skill#readme" data-i18n="foot.docs">Docs</a><a href="https://github.com/yuzhang-ai/web-animation-skill/blob/master/THIRD_PARTY.md" data-i18n="foot.credits">Credits</a></nav>
</div></footer>

<script src="assets/site.js"></script>
<script src="assets/i18n.js"></script>
<script src="templates/catalog.js"></script>
<script>
(() => {
  const data = window.CATALOG; if (!data) return;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const byId = Object.fromEntries(data.templates.map((t) => [t.id, t]));
  const groups = Object.fromEntries(data.groups.map((g) => [g.id, g]));
  const zh = () => window.LANG?.() === "zh";
  const title = (t) => (zh() && t.zh?.title) || t.title;
  const gname = (id) => (zh() && groups[id].zh?.name) || groups[id].name;
  const page = (id) => `t/${id}${zh() ? ".zh" : ""}.html`;
  // The gallery is curated: order matters, wide ones get a full row
  const PICKS = ["fluid-cursor", "lottie-like-button", "scroll-layout-flip", "iridescent-blob", "glow-cards", "shape-morph-ui", "particle-fireworks",
    "split-flap-words", "dot-globe", "stagger-ripple-grid", "seam-transition", "canvas-editor", "spring-goo-trail", "text-scramble",
    "flubber-morph", "split-text-reveal", "donut-transition", "jelly-button"].filter((id) => byId[id]);
  const WIDE = new Set(["fluid-cursor", "particle-fireworks"]);

  const gallery = document.getElementById("gallery");
  gallery.innerHTML = PICKS.map((id) => { const t = byId[id];
    return `<a class="item${WIDE.has(id) ? " wide" : ""}" href="${page(id)}" data-group="${t.group}" data-id="${id}">
      <video muted loop playsinline preload="none" data-id="${id}" aria-hidden="true"></video>
      <span class="pill"><b></b> <small></small><i aria-hidden="true">→</i></span></a>`; }).join("");
  // Names and links follow the language (videos stay put)
  const label = () => gallery.querySelectorAll(".item").forEach((a) => {
    const t = byId[a.dataset.id];
    a.href = page(t.id); a.querySelector(".pill b").textContent = title(t); a.querySelector(".pill small").textContent = gname(t.group);
  });
  label();

  // Each preview exists in both themes; swap sources when the theme changes
  const setSources = () => gallery.querySelectorAll("video").forEach((v) => {
    const sfx = document.documentElement.dataset.theme === "light" ? "-light" : "";
    const playing = !v.paused;
    v.poster = `templates/${v.dataset.id}/preview${sfx}.jpg`; v.src = `templates/${v.dataset.id}/preview${sfx}.mp4`;
    if (playing) v.play().catch(() => {});
  });
  setSources(); addEventListener("themechange", setSources);
  // Play only what's on screen
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const io = new IntersectionObserver((es) => es.forEach((e) => { const v = e.target.querySelector("video");
    if (e.isIntersecting && !reduce) { v.preload = "auto"; v.play().catch(() => {}); } else v.pause(); }), { rootMargin: "100px" });
  gallery.querySelectorAll(".item").forEach((el) => io.observe(el));

  // Filters (only stacks that appear in the gallery)
  const present = data.groups.filter((g) => PICKS.some((id) => byId[id].group === g.id));
  const filters = document.getElementById("filters");
  const renderFilters = () => {
    const on = filters.querySelector('[aria-pressed="true"]')?.dataset.g ?? "";
    filters.innerHTML = `<button type="button" aria-pressed="${on === ""}" data-g="">${zh() ? "全部" : "All"}</button>` +
      present.map((g) => `<button type="button" aria-pressed="${on === g.id}" data-g="${g.id}">${esc(gname(g.id))}</button>`).join("");
  };
  renderFilters();
  filters.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    filters.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    const apply = () => gallery.querySelectorAll(".item").forEach((el) => (el.hidden = b.dataset.g && el.dataset.group !== b.dataset.g));
    document.startViewTransition && !reduce ? document.startViewTransition(apply) : apply();
  });

  // Everything, grouped by stack
  const stacks = data.groups.filter((g) => g.count).length;
  const renderAll = () => {
    document.getElementById("count").textContent = zh() ? `共 ${data.count} 个模板，覆盖 ${stacks} 个技术栈。` : `${data.count} templates across ${stacks} stacks.`;
    document.getElementById("stacks").innerHTML = data.groups.filter((g) => g.count).map((g) =>
      `<div class="stack"><h3 id="${g.id}">${esc(gname(g.id))}</h3>${data.templates.filter((t) => t.group === g.id).map((t) =>
        `<a href="${page(t.id)}">${esc(title(t))}<span>${esc(t.stack.split(" ")[0])}</span></a>`).join("")}</div>`).join("");
  };
  renderAll();
  addEventListener("langchange", () => { label(); renderFilters(); renderAll(); });
})();
</script>
</body>
</html>
