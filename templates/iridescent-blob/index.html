<!doctype html>
<!--
  Template: iridescent-blob — Iridescent blob
  Stack: Three.js ShaderMaterial
  Credit: original for this repo (from the web-animation-skill showcase). MIT.
  Change: uAmp / uFreq, the iridescence phase vector, ring colours, camera distance.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iridescent blob</title>
<script>{ const q = new URLSearchParams(location.search); if (q.has("embed")) document.documentElement.classList.add("embed"); if (q.get("theme") === "light") document.documentElement.classList.add("light"); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }</script>
<style>
  :root {
    --bg: #0a0b0d; --card: #121418; --card-2: #16191e; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
    --ink: #f2f0ea; --muted: #8b909a; --dim: #4b505a;
    --lime: #d7ff5a; --violet: #9a8cff; --cyan: #5fd4ff; --coral: #ff7a59;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
    --stage: #0d0e12; --tile: #262a33;
  }
  /* ?theme=light: warm paper, never pure white; accents one step darker so they keep their contrast */
  html.light {
    color-scheme: light;
    --bg: #f1ede4; --card: #f7f4ed; --card-2: #fbf9f4; --line: rgba(40,32,16,.09); --line-2: rgba(40,32,16,.16);
    --ink: #1c1b18; --muted: #6d695f; --dim: #a8a295;
    --lime: #7da600; --violet: #6b58e8; --cyan: #0a92c9; --coral: #e8552f;
    --stage: #ede8dd; --tile: #ddd6c6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--bg); color: var(--ink);
         font: 15px/1.45 "Space Grotesk", system-ui, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .frame { width: min(var(--w, 720px), calc(100vw - 32px)); }
  .frame > h1 { margin: 0 0 4px; font: 400 clamp(30px, 4vw, 44px)/1 "Instrument Serif", serif; letter-spacing: -.02em; }
  .frame > p { margin: 0 0 18px; color: var(--muted); }
  .stage { position: relative; height: var(--h, 420px); border-radius: 24px; overflow: hidden;
           background: linear-gradient(180deg, var(--card-2), var(--card)); box-shadow: inset 0 0 0 1px var(--line); }
  .stage .hint { position: absolute; left: 16px; bottom: 12px; color: var(--dim); font-size: 10px; pointer-events: none; }
  /* ?embed: just the effect, edge to edge (used by the template pages' preview) */
  html.embed body { padding: 0; place-items: stretch; }
  html.embed .frame { width: 100%; }
  html.embed .frame > h1, html.embed .frame > p { display: none; }
  html.embed .stage, html.embed .hero { height: 100vh; border-radius: 0; box-shadow: none; }
  .three-wrap { position: absolute; inset: 0; background: radial-gradient(80% 90% at 50% 45%, var(--card-2), var(--stage) 70%); }
  .three-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
</style>
</head>
<body>
<main class="frame" style="--w:860px; --h:520px">
  <h1>Iridescent blob</h1>
  <p>The vertex shader displaces the sphere; the fragment shader colours it by viewing angle.</p>
  <div class="stage"><div class="three-wrap"></div><span class="hint mono">move to steer · 40k vertices displaced on the GPU</span></div>
</main>

<script type="module">
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  // ?theme=light switches the palette; canvases read these values, CSS reads the variables
  const LIGHT = document.documentElement.classList.contains("light");
  const C = LIGHT
    ? { lime: "#7da600", violet: "#6b58e8", cyan: "#0a92c9", coral: "#e8552f", ink: "#1c1b18", muted: "#6d695f", bg: "#f1ede4", card: "#f7f4ed", card2: "#fbf9f4",
        stage: "#ede8dd", tile: "#ddd6c6", dim: "#a8a295", line2: "rgba(40,32,16,.16)", blend: "source-over", fade: (a) => `rgba(237,232,221,${a})` }
    : { lime: "#d7ff5a", violet: "#9a8cff", cyan: "#5fd4ff", coral: "#ff7a59", ink: "#f2f0ea", muted: "#8b909a", bg: "#0a0b0d", card: "#121418", card2: "#16191e",
        stage: "#0d0e12", tile: "#262a33", dim: "#4b505a", line2: "rgba(255,255,255,.12)", blend: "lighter", fade: (a) => `rgba(13,14,18,${a})` };
  const PALETTE = [C.lime, C.violet, C.cyan, C.coral], P4 = () => PALETTE;
  const isLight = () => LIGHT, onTheme = () => {};

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const observeSize = (el, fn) => { const ro = new ResizeObserver(() => fn(el.clientWidth, el.clientHeight)); ro.observe(el); fn(el.clientWidth, el.clientHeight); return ro; };
  const rafLoop = (fn) => { let raf = 0, last = 0; const tick = (now) => { const dt = last ? Math.min(now - last, 50) / 1000 : 1 / 60; last = now; fn(dt, now); raf = requestAnimationFrame(tick); };
    return { start() { last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }, stop() { cancelAnimationFrame(raf); } }; };
  function run(el, api) {
    if (reduce) { api.still?.(); return; }
    let visible = false, running = false;
    const sync = () => { const on = visible && !document.hidden; if (on && !running) { running = true; api.start?.(); } else if (!on && running) { running = false; api.stop?.(); } };
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); }, { rootMargin: "60px" }).observe(el);
    document.addEventListener("visibilitychange", sync);
  }

const card = $(".stage");
  const THREE = await import("three");
  const host = $(".three-wrap", card);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  host.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0, 6.2);

  const NOISE = `
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
      i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }`;
  const uniforms = { uTime: { value: 0 }, uAmp: { value: 0.3 }, uLight: { value: isLight() ? 1 : 0 } };
  const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: NOISE + `
      uniform float uTime; uniform float uAmp;
      varying vec3 vN; varying vec3 vW; varying float vD;
      float disp(vec3 n){ return snoise(n*0.95 + vec3(0.0, uTime*0.28, uTime*0.16))*uAmp + snoise(n*1.9 - uTime*0.2)*uAmp*0.18; }
      vec3 surf(vec3 p){ vec3 n = normalize(p); return n * (1.0 + disp(n)); }
      void main(){
        vec3 n = normalize(position);
        vec3 up = abs(n.y) > 0.99 ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);
        vec3 t = normalize(cross(n, up)); vec3 b = normalize(cross(n, t));
        float e = 0.012;
        vec3 p0 = surf(n); vec3 p1 = surf(n + t*e); vec3 p2 = surf(n + b*e);
        vec3 nn = normalize(cross(p1 - p0, p2 - p0));
        if (dot(nn, n) < 0.0) nn = -nn;
        vD = disp(n);
        vec4 w = modelMatrix * vec4(p0, 1.0);
        vW = w.xyz; vN = normalize(mat3(modelMatrix) * nn);
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform float uTime; uniform float uLight; varying vec3 vN; varying vec3 vW; varying float vD;
      void main(){
        vec3 n = normalize(vN); vec3 v = normalize(cameraPosition - vW);
        float fres = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 2.0);
        vec3 iri = 0.5 + 0.5*cos(6.28318*(vec3(0.0, 0.33, 0.67) + fres*0.85 + vD*1.8 + uTime*0.05));
        vec3 L = normalize(vec3(0.5, 0.8, 0.6));
        float diff = clamp(dot(n, L), 0.0, 1.0);
        float spec = pow(clamp(dot(n, normalize(L + v)), 0.0, 1.0), 70.0);
        // light theme: a pearly body instead of a near-black one
        vec3 body = mix(vec3(0.05, 0.055, 0.08), vec3(0.62, 0.6, 0.57), uLight);
        vec3 col = body + iri*(0.18 + 0.82*fres)*(1.0 - 0.3*uLight) + diff*(0.1 + 0.15*uLight) + spec*0.9;
        col += vec3(0.84, 1.0, 0.35) * pow(fres, 5.0) * 0.7;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 64), material);
  scene.add(blob);
  const rings = [[1.85, C.violet, 1.2, 0.3], [2.15, C.cyan, -0.9, -0.5]].map(([r, c, rx, rz]) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, 0.007, 8, 220), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.55 }));
    m.rotation.set(rx, 0, rz); scene.add(m); return m;
  });
  const starGeo = new THREE.BufferGeometry(), N = 900, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(2.3 + Math.random() * 1.6); pos.set([v.x, v.y, v.z], i * 3); }
  starGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: C.lime, size: 0.02, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(stars);

  const paint3 = () => {
    const light = isLight();
    stars.material.color.set(light ? C.violet : C.lime); stars.material.blending = light ? THREE.NormalBlending : THREE.AdditiveBlending; stars.material.needsUpdate = true;
    rings[0].material.color.set(C.violet); rings[1].material.color.set(C.cyan);
  };
  paint3(); onTheme(() => { uniforms.uLight.value = isLight() ? 1 : 0; paint3(); frame(); });
  const target = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
  card.addEventListener("pointermove", (e) => { const r = host.getBoundingClientRect(); target.x = ((e.clientX - r.left) / r.width - 0.5) * 2; target.y = ((e.clientY - r.top) / r.height - 0.5) * 2; });
  card.addEventListener("pointerleave", () => { target.x = 0; target.y = 0; });
  observeSize(host, (w, h) => { if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.position.z = w / h < 1 ? 8 : 6.2; camera.updateProjectionMatrix(); });

  const timer = new THREE.Timer();
  let t = 0;
  function frame(time) {
    if (time !== undefined) timer.update(time);
    const dt = Math.min(timer.getDelta(), 0.05); t += dt;
    cur.x += (target.x - cur.x) * 0.05; cur.y += (target.y - cur.y) * 0.05;
    uniforms.uTime.value = t;
    uniforms.uAmp.value = 0.22 + Math.hypot(cur.x, cur.y) * 0.1;
    blob.rotation.y = t * 0.18 + cur.x * 0.8; blob.rotation.x = cur.y * 0.6;
    rings[0].rotation.z += dt * 0.25; rings[1].rotation.z -= dt * 0.18;
    rings.forEach((r) => { r.rotation.x += (cur.y * 0.3 - (r.rotation.x - (r === rings[0] ? 1.2 : -0.9)) * 0.02) * 0.02; });
    stars.rotation.y = t * 0.03 + cur.x * 0.15; stars.rotation.x = cur.y * 0.1;
    renderer.render(scene, camera);
  }
  frame();
  run(card, { start() { timer.reset?.(); renderer.setAnimationLoop(frame); }, stop() { renderer.setAnimationLoop(null); }, still() { frame(); } });
</script>
</body>
</html>
