<style>
  :root {
    --bg: #0a0b0d; --card: #121418; --card-2: #16191e; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);

    --stage: #0d0e12; --tile: #262a33;
  }
  /* ?theme=light: warm paper, never pure white; accents one step darker so they keep their contrast */
  html.light {
    color-scheme: light;
    --bg: #f1ede4; --card: #f7f4ed; --card-2: #fbf9f4; --line: rgba(40,32,16,.09); --line-2: rgba(40,32,16,.16);

  * { box-sizing: border-box; }

  .frame { width: min(var(--w, 720px), calc(100vw - 32px)); }
  .frame > h1 { margin: 0 0 4px; font: 400 clamp(30px, 4vw, 44px)/1 "Instrument Serif", serif; letter-spacing: -.02em; }
  .frame > p { margin: 0 0 18px; color: var(--muted); }
  .stage { position: relative; height: var(--h, 420px); border-radius: 24px; overflow: hidden;

  .stage .hint { position: absolute; left: 16px; bottom: 12px; color: var(--dim); font-size: 10px; pointer-events: none; }
  /* ?embed: just the effect, edge to edge (used by the template pages' preview) */
  html.embed body { padding: 0; place-items: stretch; }

  html.embed .frame > h1, html.embed .frame > p { display: none; }
  html.embed .stage, html.embed .hero { height: 100vh; border-radius: 0; box-shadow: none; }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .cssk { position: absolute; inset: 0; display: grid; place-items: center; }
  .ringwrap { position: relative; width: 200px; aspect-ratio: 1; display: grid; place-items: center; }
  .ring, .ring-glow { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from var(--a), var(--lime), var(--cyan), var(--violet), var(--coral), var(--lime)); animation: spin-a 2.6s linear infinite; }
  .ring { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); }
  .ring-glow { filter: blur(22px); opacity: .55; -webkit-mask: radial-gradient(farthest-side, transparent 60%, #000 85%); mask: radial-gradient(farthest-side, transparent 60%, #000 85%); }
  .blob { width: 62%; aspect-ratio: 1; background: conic-gradient(from var(--a), var(--violet), var(--cyan), var(--lime), var(--violet)); animation: morph 7s ease-in-out infinite, spin-a 9s linear infinite reverse; border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; box-shadow: inset 0 0 22px rgba(0,0,0,.35); }
  @keyframes spin-a { to { --a: 360deg; } }
  @keyframes morph {
    0%, 100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: rotate(0deg) scale(1); }
    33% { border-radius: 70% 30% 46% 54% / 30% 39% 61% 70%; transform: rotate(60deg) scale(.94); }
    66% { border-radius: 30% 70% 38% 62% / 62% 54% 46% 38%; transform: rotate(-40deg) scale(1.04); }
  }
  @media (prefers-reduced-motion: reduce) { .ring, .ring-glow, .blob { animation: none; } }
</style>
</head>

  <h1>Conic ring</h1>
  <p>A registered <angle> property is the only thing that moves. No JavaScript.</p>
  <div class="stage"><div class="cssk"><div class="ringwrap"><div class="ring-glow"></div><div class="ring"></div><div class="blob"></div></div></div><span class="hint mono">--a: &lt;angle&gt;</span></div>
</main>

        stage: "#0d0e12", tile: "#262a33", dim: "#4b505a", line2: "rgba(255,255,255,.12)", blend: "lighter", fade: (a) => `rgba(13,14,18,${a})` };

  const rafLoop = (fn) => { let raf = 0, last = 0; const tick = (now) => { const dt = last ? Math.min(now - last, 50) / 1000 : 1 / 60; last = now; fn(dt, now); raf = requestAnimationFrame(tick); };

    new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); }, { rootMargin: "60px" }).observe(el);

</html>
