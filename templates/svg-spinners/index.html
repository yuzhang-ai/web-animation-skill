  Template: svg-spinners — 16 loading indicators, each one self-contained SVG with SMIL animation
  Stack: inline SVG + SMIL (no CSS, no JS needed to animate)
  Spinners from "SVG Spinners" by Shubham Jain — https://github.com/shubhamjain/svg-spinners
  MIT License, Copyright (c) 2024 Shubham Jain. Page code original. MIT.
  Change: size with width/height, color with CSS `color` (they use fill="currentColor").
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG spinners</title>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.classList.add("light");</script>
<style>
  :root { --bg: #0b0c0f; --fg: #ecebe6; --muted: #8b8b86; --line: #22242a; --accent: #d7ff5a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 48px 16px; display: grid; place-content: center; gap: 28px;
    background: var(--bg); color: var(--fg); text-align: center;
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  /* Explicit width: inside a centred grid body, 100% would shrink to the content */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; width: min(960px, calc(100vw - 32px)); }
  .cell { margin: 0; display: grid; gap: 10px; justify-items: center; padding: 22px 8px 14px; border: 1px solid var(--line); border-radius: 14px; }
  .cell:nth-child(4n + 1) .spin { color: var(--accent); }
  .spin { all: unset; cursor: copy; color: var(--fg); border-radius: 8px; padding: 6px; }
  .spin:focus-visible { outline: 2px solid var(--accent); }
  .spin svg { width: 40px; height: 40px; display: block; }
  figcaption { font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 20px; opacity: 0; padding: 8px 14px; border-radius: 999px;
           background: var(--accent); color: var(--bg); font-size: 14px; font-weight: 600; transition: opacity .2s, translate .2s; }
  .toast.show { opacity: 1; translate: -50% 0; }
  /* ?theme=light: warm paper, never pure white; accents one step darker so they keep their contrast */
  html.light { color-scheme: light; --bg: #f1ede4; --fg: #1c1b18; --muted: #6d695f; --accent: #7da600; --line: #d9d2c3;
               --card: #f7f4ed; --panel: #e9e3d6; --edge: rgb(40 32 16 / 0.1); --glow: 125 166 0; }
  html.light .toast { color: #f7f4ed; }
</style>
</head>

  <div class="toast" id="toast" role="status"></div>
<script>
  // SMIL ignores prefers-reduced-motion, so pause it by hand (and resume if the setting changes)
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const svgs = [...document.querySelectorAll(".spin svg")];
  const sync = () => svgs.forEach((s) => (reduce.matches ? s.pauseAnimations() : s.unpauseAnimations()));
  reduce.addEventListener("change", sync); sync();

  const toast = document.getElementById("toast");
  for (const btn of document.querySelectorAll(".spin")) {
    btn.addEventListener("click", async () => {
      const svg = btn.querySelector("svg").cloneNode(true);
      svg.removeAttribute("role"); svg.removeAttribute("aria-label");
      try { await navigator.clipboard.writeText(svg.outerHTML); toast.textContent = `Copied ${btn.dataset.name}`; }
      catch { toast.textContent = "Copy blocked: open the file over http(s)"; }
      toast.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove("show"), 1400);
    });
  }
</script>
