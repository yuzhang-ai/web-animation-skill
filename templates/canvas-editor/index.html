<!doctype html>
<!--
  Template: canvas-editor — Canvas editor
  Stack: Konva Transformer + Tween
  Credit: original for this repo (from the web-animation-skill showcase). MIT.
  Change: the shapes, GRID, snapping rules, the Transformer's anchors and rotationSnaps.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas editor</title>
<script>{ const q = new URLSearchParams(location.search); if (q.has("embed")) document.documentElement.classList.add("embed"); if (q.get("theme") === "light") document.documentElement.classList.add("light"); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d; --card: #121418; --card-2: #16191e; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
    --ink: #f2f0ea; --muted: #8b909a; --dim: #4b505a;
    --lime: #d7ff5a; --violet: #9a8cff; --cyan: #5fd4ff; --coral: #ff7a59;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
    --stage: #0d0e12; --tile: #262a33;
  }
  /* ?theme=light: warm paper, never pure white; accents one step darker so they keep their contrast */
  html.light {
    color-scheme: light;
    --bg: #f1ede4; --card: #f7f4ed; --card-2: #fbf9f4; --line: rgba(40,32,16,.09); --line-2: rgba(40,32,16,.16);
    --ink: #1c1b18; --muted: #6d695f; --dim: #a8a295;
    --lime: #7da600; --violet: #6b58e8; --cyan: #0a92c9; --coral: #e8552f;
    --stage: #ede8dd; --tile: #ddd6c6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--bg); color: var(--ink);
         font: 15px/1.45 "Space Grotesk", system-ui, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .frame { width: min(var(--w, 720px), calc(100vw - 32px)); }
  .frame > h1 { margin: 0 0 4px; font: 400 clamp(30px, 4vw, 44px)/1 "Instrument Serif", serif; letter-spacing: -.02em; }
  .frame > p { margin: 0 0 18px; color: var(--muted); }
  .stage { position: relative; height: var(--h, 420px); border-radius: 24px; overflow: hidden;
           background: linear-gradient(180deg, var(--card-2), var(--card)); box-shadow: inset 0 0 0 1px var(--line); }
  .stage .hint { position: absolute; left: 16px; bottom: 12px; color: var(--dim); font-size: 10px; pointer-events: none; }
  /* ?embed: just the effect, edge to edge (used by the template pages' preview) */
  html.embed body { padding: 0; place-items: stretch; }
  html.embed .frame { width: 100%; }
  html.embed .frame > h1, html.embed .frame > p { display: none; }
  html.embed .stage, html.embed .hero { height: 100vh; border-radius: 0; box-shadow: none; }
  .konva-stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<main class="frame" style="--w:760px; --h:460px">
  <h1>Canvas editor</h1>
  <p>Konva gives canvas shapes DOM-like events, dragging and a ready-made Transformer.</p>
  <div class="stage"><div class="konva-stage"></div><span class="hint mono">drag · click to select · rotate &amp; resize</span></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/konva@10.9.1/konva.min.js"></script>
<script>
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  // ?theme=light switches the palette; canvases read these values, CSS reads the variables
  const LIGHT = document.documentElement.classList.contains("light");
  const C = LIGHT
    ? { lime: "#7da600", violet: "#6b58e8", cyan: "#0a92c9", coral: "#e8552f", ink: "#1c1b18", muted: "#6d695f", bg: "#f1ede4", card: "#f7f4ed", card2: "#fbf9f4",
        stage: "#ede8dd", tile: "#ddd6c6", dim: "#a8a295", line2: "rgba(40,32,16,.16)", blend: "source-over", fade: (a) => `rgba(237,232,221,${a})` }
    : { lime: "#d7ff5a", violet: "#9a8cff", cyan: "#5fd4ff", coral: "#ff7a59", ink: "#f2f0ea", muted: "#8b909a", bg: "#0a0b0d", card: "#121418", card2: "#16191e",
        stage: "#0d0e12", tile: "#262a33", dim: "#4b505a", line2: "rgba(255,255,255,.12)", blend: "lighter", fade: (a) => `rgba(13,14,18,${a})` };
  const PALETTE = [C.lime, C.violet, C.cyan, C.coral], P4 = () => PALETTE;
  const isLight = () => LIGHT, onTheme = () => {};

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const observeSize = (el, fn) => { const ro = new ResizeObserver(() => fn(el.clientWidth, el.clientHeight)); ro.observe(el); fn(el.clientWidth, el.clientHeight); return ro; };
  const rafLoop = (fn) => { let raf = 0, last = 0; const tick = (now) => { const dt = last ? Math.min(now - last, 50) / 1000 : 1 / 60; last = now; fn(dt, now); raf = requestAnimationFrame(tick); };
    return { start() { last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }, stop() { cancelAnimationFrame(raf); } }; };
  function run(el, api) {
    if (reduce) { api.still?.(); return; }
    let visible = false, running = false;
    const sync = () => { const on = visible && !document.hidden; if (on && !running) { running = true; api.start?.(); } else if (!on && running) { running = false; api.stop?.(); } };
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); }, { rootMargin: "60px" }).observe(el);
    document.addEventListener("visibilitychange", sync);
  }

{

  const card = $(".stage"), host = $(".konva-stage");
  let W = host.clientWidth || 600, H = host.clientHeight || 400;
  const stage = new Konva.Stage({ container: host, width: W, height: H });
  const bg = new Konva.Layer({ listening: false }), layer = new Konva.Layer();
  stage.add(bg, layer);
  const GRID = 24;
  const drawGrid = () => { bg.destroyChildren();
    for (let x = GRID; x < W; x += GRID) for (let y = GRID; y < H; y += GRID) bg.add(new Konva.Circle({ x, y, radius: 1, fill: C.line2 }));
    bg.draw(); };
  drawGrid();
  const snap = (v) => Math.round(v / GRID) * GRID;
  const glow = (c) => ({ shadowColor: c, shadowBlur: 24, shadowOpacity: 0.45 });
  // Four kinds of shape; every one is draggable, selectable and transformable
  const shapes = [
    new Konva.Rect({ x: W * 0.22, y: H * 0.34, width: 120, height: 84, cornerRadius: 16, fill: C.lime, offsetX: 60, offsetY: 42, ...glow(C.lime) }),
    new Konva.Circle({ x: W * 0.52, y: H * 0.62, radius: 46, fill: C.violet, ...glow(C.violet) }),
    new Konva.Star({ x: W * 0.78, y: H * 0.36, numPoints: 5, innerRadius: 22, outerRadius: 50, fill: C.coral, ...glow(C.coral) }),
    new Konva.Text({ x: W * 0.3, y: H * 0.78, text: "drag me", fontSize: 34, fontFamily: "Instrument Serif", fontStyle: "italic", fill: C.ink }),
  ];
  shapes.forEach((s) => { s.draggable(true); layer.add(s); });
  const tr = new Konva.Transformer({ rotateEnabled: true, keepRatio: true, anchorSize: 9, anchorCornerRadius: 3, anchorStroke: C.lime, anchorFill: C.bg,
    borderStroke: C.lime, borderDash: [4, 4], rotationSnaps: [0, 45, 90, 135, 180, 225, 270, 315], padding: 6 });
  layer.add(tr);
  // Centre guides appear while a shape is near the middle
  const guideV = new Konva.Line({ points: [0, 0, 0, H], stroke: C.cyan, strokeWidth: 1, dash: [4, 6], visible: false, listening: false });
  const guideH = new Konva.Line({ points: [0, 0, W, 0], stroke: C.cyan, strokeWidth: 1, dash: [4, 6], visible: false, listening: false });
  layer.add(guideV, guideH);

  const select = (s) => { tr.nodes(s ? [s] : []); if (s) s.moveToTop(), tr.moveToTop(); };
  stage.on("pointerdown", (e) => { stop(); select(e.target === stage ? null : e.target); });
  shapes.forEach((s) => {
    s.on("mouseenter", () => { host.style.cursor = "grab"; s.to({ scaleX: s.scaleX() * 1.04, scaleY: s.scaleY() * 1.04, duration: 0.15 }); });
    s.on("mouseleave", () => { host.style.cursor = ""; s.to({ scaleX: s.scaleX() / 1.04, scaleY: s.scaleY() / 1.04, duration: 0.15 }); });
    s.on("dragmove", () => {
      const cx = Math.abs(s.x() - W / 2) < 10, cy = Math.abs(s.y() - H / 2) < 10;
      if (cx) s.x(W / 2); if (cy) s.y(H / 2);                       // magnetic centre lines
      guideV.points([W / 2, 0, W / 2, H]).visible(cx); guideH.points([0, H / 2, W, H / 2]).visible(cy);
    });
    s.on("dragend", () => {                                          // settle onto the grid with a little spring
      guideV.hide(); guideH.hide();
      new Konva.Tween({ node: s, x: snap(s.x()), y: snap(s.y()), duration: 0.45, easing: Konva.Easings.ElasticEaseOut }).play();
    });
  });

  // Idle demo: pick a shape, move / rotate / scale it with tweens while the Transformer follows
  let timer = 0, k = 0;
  function step() {
    const s = shapes[k++ % shapes.length];
    select(s);
    const sc = 0.85 + Math.random() * 0.3;
    // keep the whole shape inside the stage at its new scale; text stays upright
    const r = s.getClientRect({ skipTransform: true }), hw = (r.width * sc) / 2 + 14, hh = (r.height * sc) / 2 + 14;
    const x = hw >= W / 2 ? W / 2 : hw + Math.random() * (W - 2 * hw), y = hh >= H / 2 ? H / 2 : hh + Math.random() * (H - 2 * hh);
    new Konva.Tween({ node: s, x, y, rotation: s instanceof Konva.Text ? 0 : -25 + Math.random() * 50,
      scaleX: sc, scaleY: sc, duration: 0.9, easing: Konva.Easings.EaseInOut, onUpdate: () => tr.forceUpdate() }).play();
  }
  function stop() { clearInterval(timer); timer = 0; }
  observeSize(host, (w, h) => { if (!w || !h) return; W = w; H = h; stage.size({ width: w, height: h }); drawGrid(); });
  run(card, {
    start() { if (!timer) { step(); timer = setInterval(step, 1600); } },
    stop,
    still() { select(shapes[0]); },
  });
}
</script>
</body>
</html>
