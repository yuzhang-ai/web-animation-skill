<!doctype html>
<!--
  Template: flow-field-hero — Flow field hero
  Stack: Canvas 2D
  Credit: original for this repo (from the web-animation-skill showcase). MIT.
  Change: the field() function, colours, particle count, the fade alpha (0.085).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow field hero</title>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.classList.add("light");</script>
<script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d; --card: #121418; --card-2: #16191e; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
    --ink: #f2f0ea; --muted: #8b909a; --dim: #4b505a;
    --lime: #d7ff5a; --violet: #9a8cff; --cyan: #5fd4ff; --coral: #ff7a59;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--bg); color: var(--ink);
         font: 15px/1.45 "Space Grotesk", system-ui, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .frame { width: min(var(--w, 720px), calc(100vw - 32px)); }
  .frame > h1 { margin: 0 0 4px; font: 400 clamp(30px, 4vw, 44px)/1 "Instrument Serif", serif; letter-spacing: -.02em; }
  .frame > p { margin: 0 0 18px; color: var(--muted); }
  .stage { position: relative; height: var(--h, 420px); border-radius: 24px; overflow: hidden;
           background: linear-gradient(180deg, var(--card-2), var(--card)); box-shadow: inset 0 0 0 1px var(--line); }
  .stage .hint { position: absolute; left: 16px; bottom: 12px; color: var(--dim); font-size: 10px; pointer-events: none; }
  .hero { position: relative; height: var(--h); border-radius: 24px; overflow: hidden; isolation: isolate; box-shadow: inset 0 0 0 1px var(--line); }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(120% 70% at 20% 100%, rgba(10,11,13,.92), transparent 60%); }
  .hero .copy { position: absolute; left: 32px; bottom: 28px; }
  .hero .copy h2 { margin: 0; font: 400 clamp(54px, 9vw, 120px)/.86 "Instrument Serif", serif; letter-spacing: -.035em; }
  .hero .copy h2 em { color: var(--lime); }
  html.embed body { padding: 0; place-items: stretch; }
  html.embed .frame { width: 100%; }
  html.embed .frame > h1, html.embed .frame > p { display: none; }
  html.embed .stage, html.embed .hero { height: 100vh; border-radius: 0; box-shadow: none; }
  /* ?theme=light: warm paper, never pure white; accents one step darker so they keep their contrast */
  html.light { color-scheme: light; --bg: #f1ede4; --fg: #1c1b18; --muted: #6d695f; --accent: #7da600; --line: #d9d2c3;
               --card: #f7f4ed; --panel: #e9e3d6; --edge: rgb(40 32 16 / 0.1); --glow: 125 166 0; }
  html.light .hero { background: #f1ede4; }
  html.light .hero canvas { filter: invert(1) hue-rotate(180deg) saturate(1.25); mix-blend-mode: multiply; }
  html.light .hero::after { background: radial-gradient(120% 70% at 20% 100%, rgb(241 237 228 / 0.92), transparent 60%); }
  html.light .hero .copy h2 { color: #1c1b18; }
  html.light .hero .copy h2 em { color: #4f6c00; }
  html.light body { background: #f1ede4; }
</style>
</head>
<body>
<main class="frame" style="--w:1100px; --h:560px">
  <h1>Flow field hero</h1>
  <p>One Path2D per colour, one stroke per colour per frame: that is how 2,600 trails stay at 60fps.</p>
  <div class="hero"><canvas aria-hidden="true"></canvas><div class="copy"><h2>Motion,<br><em>verified.</em></h2></div></div>
</main>

<script>
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const C = { lime: "#d7ff5a", violet: "#9a8cff", cyan: "#5fd4ff", coral: "#ff7a59", ink: "#f2f0ea", bg: "#0a0b0d", card: "#121418", dim: "#4b505a" };
  const PALETTE = [C.lime, C.violet, C.cyan, C.coral];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const observeSize = (el, fn) => { const ro = new ResizeObserver(() => fn(el.clientWidth, el.clientHeight)); ro.observe(el); fn(el.clientWidth, el.clientHeight); return ro; };
  const rafLoop = (fn) => { let raf = 0, last = 0; const tick = (now) => { const dt = last ? Math.min(now - last, 50) / 1000 : 1 / 60; last = now; fn(dt, now); raf = requestAnimationFrame(tick); };
    return { start() { last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }, stop() { cancelAnimationFrame(raf); } }; };
  function run(el, api) {
    if (reduce) { api.still?.(); return; }
    let visible = false, running = false;
    const sync = () => { const on = visible && !document.hidden; if (on && !running) { running = true; api.start?.(); } else if (!on && running) { running = false; api.stop?.(); } };
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); }, { rootMargin: "60px" }).observe(el);
    document.addEventListener("visibilitychange", sync);
  }

{
  const hero = $(".hero");
  const canvas = $("canvas", hero), ctx = canvas.getContext("2d");
  const cols = ["215,255,90", "154,140,255", "95,212,255", "255,122,89"];
  let W = 0, H = 0, parts = [], t = 0;
  const ptr = { x: 0, y: 0, active: false, sx: 0, sy: 0 };
  const pick = () => { const r = Math.random(); return r < 0.42 ? 0 : r < 0.66 ? 1 : r < 0.86 ? 2 : 3; };
  const spawn = (p = {}) => Object.assign(p, { x: Math.random() * W, y: Math.random() * H, life: 80 + Math.random() * 260, c: pick(), s: 0.5 + Math.random() * 1.3 });
  function resize(w, h) {
    if (!w || !h) return;
    const dpr = Math.min(devicePixelRatio, 2);
    W = w; H = h; canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const n = Math.min(2600, Math.floor((W * H) / 420));
    parts = Array.from({ length: n }, () => spawn());
  }
  observeSize(hero, resize);
  hero.addEventListener("pointermove", (e) => { const r = hero.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; ptr.active = true; });
  hero.addEventListener("pointerleave", () => (ptr.active = false));
  const field = (x, y) => { const s = 0.0016; return Math.sin(x * s * 1.3 + t * 0.17) * 1.7 + Math.cos(y * s * 1.8 - t * 0.13) * 1.7 + Math.sin((x - y) * s * 0.6 + t * 0.07) * 1.3; };
  function step(dt) {
    t += dt;
    // auto "ghost cursor" when idle, so the field always has a swirl in it
    const gx = W * (0.62 + Math.sin(t * 0.35) * 0.22), gy = H * (0.42 + Math.sin(t * 0.53) * 0.2);
    const tx = ptr.active ? ptr.x : gx, ty = ptr.active ? ptr.y : gy;
    ptr.sx += (tx - ptr.sx) * 0.08; ptr.sy += (ty - ptr.sy) * 0.08;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(10,11,13,0.085)"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter"; ctx.lineWidth = 1.15; ctx.lineCap = "round";
    const paths = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    const R = Math.min(W, H) * 0.32, R2 = R * R;
    for (const p of parts) {
      const a = field(p.x, p.y);
      let vx = Math.cos(a) * p.s * 1.5, vy = Math.sin(a) * p.s * 1.5;
      const dx = p.x - ptr.sx, dy = p.y - ptr.sy, d2 = dx * dx + dy * dy;
      if (d2 < R2 && d2 > 1) { const d = Math.sqrt(d2), f = (1 - d / R) ** 2; vx += (-dy / d) * f * 5 + (dx / d) * f * 1.2; vy += (dx / d) * f * 5 + (dy / d) * f * 1.2; }
      const path = paths[p.c]; path.moveTo(p.x, p.y); p.x += vx; p.y += vy; path.lineTo(p.x, p.y);
      if (--p.life < 0 || p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) spawn(p);
    }
    paths.forEach((path, i) => { ctx.strokeStyle = `rgba(${cols[i]},${i === 0 ? 0.5 : 0.55})`; ctx.stroke(path); });
  }
  const loop = rafLoop(step);
  run(hero, {
    start: loop.start, stop: loop.stop,
    still() { for (let i = 0; i < 90; i++) step(1 / 60); },
  });
}
</script>
</body>
</html>
