<!doctype html>
<!--
  Template: scroll-layout-flip — pinned galleries that morph into a new layout as you scroll
  Stack: GSAP 3.15.1 + Flip + ScrollTrigger
  Adapted from "On-Scroll Image Layout Animations" by Codrops
  https://github.com/codrops/ScrollBasedLayoutAnimations
  Copyright (c) 2009 - 2022 Codrops — MIT License. Simplified (no Lenis, procedural tiles) for this repo.
  Change: add a gallery = markup with a start-layout class + CSS for .is-final; register it in GALLERIES.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll layout flip</title>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.classList.add("light");</script>
<style>
  :root { --bg: #0b0c0f; --fg: #ecebe6; --muted: #8b8b86; --accent: #d7ff5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .intro, .outro { min-height: 70svh; display: grid; place-content: center; text-align: center; padding: 0 16px; }
  .intro h1 { margin: 0; font-size: clamp(34px, 7vw, 84px); letter-spacing: -0.03em; line-height: 1; }
  .intro p, .outro p { color: var(--muted); margin: 12px 0 0; }

  /* Each gallery is pinned inside a full-screen wrapper while it changes layout */
  .wrap { position: relative; height: 100svh; display: grid; place-items: center; overflow: clip; }
  .gallery { position: relative; width: 100%; height: 100%; }
  .tile {
    position: relative; border-radius: 8px; flex: none;
    background: radial-gradient(120% 90% at 30% 20%, hsl(var(--h) 80% 70%), transparent 60%),
                linear-gradient(160deg, hsl(calc(var(--h) + 40) 55% 32%), hsl(calc(var(--h) + 90) 50% 12%));
  }
  .caption { position: absolute; z-index: 10; margin: 0; font-size: clamp(18px, 3vw, 30px); letter-spacing: -0.01em; }

  /* 1 · Row → the centre tile takes over the screen */
  .row { display: flex; align-items: center; justify-content: center; gap: 2vw; --u: 18vh; }
  .row .tile { aspect-ratio: 2 / 3; height: var(--u); }
  .row .m { height: calc(var(--u) * 1.4); } .row .l { height: calc(var(--u) * 2.2); }
  .row .xl { height: calc(var(--u) * 3.2); z-index: 5; }
  .row.is-final .m, .row.is-final .l { height: var(--u); }
  .row.is-final .xl { height: 100svh; width: 100vw; aspect-ratio: auto; border-radius: 0; filter: brightness(0.55); }
  .row .caption { left: 6vw; bottom: -40svh; opacity: 0; max-width: 18ch; }
  .row.is-final .caption { bottom: 8svh; opacity: 1; }

  /* 2 · Spread grid → fanned stack */
  .stack { display: grid; grid-template-columns: repeat(6, 1fr); align-items: center; gap: 2vw; padding: 4vw; --o: 1.2rem; }
  .stack .tile { width: 100%; aspect-ratio: 3 / 4; border-radius: 1.4vw; }
  .stack.is-final { grid-template-columns: 1fr; justify-items: center; }
  .stack.is-final .tile { grid-area: 1 / 1; width: min(26vw, 260px); }
  .stack.is-final .tile:nth-child(2) { margin-left: calc(var(--o) * 2); }
  .stack.is-final .tile:nth-child(3) { margin-left: calc(var(--o) * 4); }
  .stack.is-final .tile:nth-child(4) { margin-left: calc(var(--o) * 6); }
  .stack.is-final .tile:nth-child(5) { margin-left: calc(var(--o) * 8); }
  .stack.is-final .tile:nth-child(6) { margin-left: calc(var(--o) * 10); }
  .stack .caption { left: 6vw; bottom: 8svh; opacity: 0; translate: 0 6vh; }
  .stack.is-final .caption { opacity: 1; translate: 0 0; }

  /* 3 · Bento → each tile blows up past the screen edges */
  .bento { display: grid; gap: 1vh; grid-template-columns: repeat(3, 30vw); grid-template-rows: repeat(4, 21vh); place-content: center; }
  .bento.is-final { grid-template-columns: repeat(3, 100vw); grid-template-rows: repeat(4, 49vh); gap: 15vh; }
  .bento .tile:nth-child(1) { grid-area: 1 / 1 / 3 / 2; } .bento .tile:nth-child(2) { grid-area: 1 / 2 / 2 / 3; }
  .bento .tile:nth-child(3) { grid-area: 2 / 2 / 4 / 3; } .bento .tile:nth-child(4) { grid-area: 1 / 3 / 3 / 4; }
  .bento .tile:nth-child(5) { grid-area: 3 / 1 / 4 / 2; } .bento .tile:nth-child(6) { grid-area: 3 / 3 / 5 / 4; }
  .bento .tile:nth-child(7) { grid-area: 4 / 1 / 5 / 2; } .bento .tile:nth-child(8) { grid-area: 4 / 2 / 5 / 3; }
  .bento .caption { inset: 0; display: grid; place-items: center; font-size: clamp(32px, 9vw, 96px); letter-spacing: -0.03em; opacity: 0; }
  .bento.is-final .caption { opacity: 1; }

  @media (max-width: 640px) {
    .stack { grid-template-columns: repeat(3, 1fr); }
    .stack.is-final .tile { width: 52vw; }
    .bento { grid-template-columns: repeat(3, 31vw); }
  }
  /* ?theme=light: warm paper, never pure white; accents one step darker so they keep their contrast */
  html.light { color-scheme: light; --bg: #f1ede4; --fg: #1c1b18; --muted: #6d695f; --accent: #7da600; --line: #d9d2c3;
               --card: #f7f4ed; --panel: #e9e3d6; --edge: rgb(40 32 16 / 0.1); --glow: 125 166 0; }
</style>
</head>
<body>
  <section class="intro"><div><h1>Layouts that move</h1><p>Scroll. Each gallery pins, then rearranges itself.</p></div></section>

  <div class="wrap"><div class="gallery row" data-gallery="row">
    <div class="tile" style="--h:200"></div><div class="tile m" style="--h:230"></div><div class="tile l" style="--h:260"></div>
    <div class="tile xl" style="--h:20"></div>
    <div class="tile l" style="--h:290"></div><div class="tile m" style="--h:320"></div><div class="tile" style="--h:350"></div>
    <p class="caption">One frame takes the whole screen.</p>
  </div></div>

  <div class="wrap"><div class="gallery stack" data-gallery="stack">
    <div class="tile" style="--h:140"></div><div class="tile" style="--h:170"></div><div class="tile" style="--h:200"></div>
    <div class="tile" style="--h:110"></div><div class="tile" style="--h:80"></div><div class="tile" style="--h:50"></div>
    <p class="caption">Six frames, one deck.</p>
  </div></div>

  <div class="wrap"><div class="gallery bento" data-gallery="bento">
    <div class="tile" style="--h:300"></div><div class="tile" style="--h:330"></div><div class="tile" style="--h:0"></div><div class="tile" style="--h:30"></div>
    <div class="tile" style="--h:60"></div><div class="tile" style="--h:90"></div><div class="tile" style="--h:240"></div><div class="tile" style="--h:270"></div>
    <p class="caption">Zoom out.</p>
  </div></div>

  <section class="outro"><p>Fin.</p></section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/Flip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(Flip, ScrollTrigger);

  // Per-gallery options: how long it stays pinned and how the tiles move
  const GALLERIES = {
    row:   { end: "+=300%", flip: { absoluteOnLeave: true, scale: false } },
    stack: { end: "+=250%", stagger: 0.05, ease: "power2.inOut" },
    bento: { end: "+=300%" },
  };

  function flipOnScroll(gallery, o) {
    const items = gallery.querySelectorAll(".tile, .caption");
    // Record the FINAL layout, then put the start layout back
    gallery.classList.add("is-final");
    const state = Flip.getState(items, { props: "filter, opacity" });
    gallery.classList.remove("is-final");
    // Flip.to animates from the current (start) layout to the recorded one, scrubbed by scroll
    Flip.to(state, {
      ease: o.ease || "none", stagger: o.stagger || 0, simple: true,
      absolute: false, scale: true, ...o.flip,
      scrollTrigger: { trigger: gallery, start: "center center", end: o.end, pin: gallery.parentNode, scrub: true },
    });
  }

  const build = () => document.querySelectorAll("[data-gallery]").forEach((g) => flipOnScroll(g, GALLERIES[g.dataset.gallery] || {}));

  const mm = gsap.matchMedia();
  mm.add("(prefers-reduced-motion: no-preference)", () => {
    // Reverting a Flip leaves its end state inline, so remember the original style attributes
    const els = [...document.querySelectorAll("[data-gallery] .tile, [data-gallery] .caption")];
    const styles = els.map((el) => el.getAttribute("style"));
    const reset = () => els.forEach((el, i) => (styles[i] === null ? el.removeAttribute("style") : el.setAttribute("style", styles[i])));

    let ctx = gsap.context(build);
    // Flip records pixels: rebuild after a real resize (ignore mobile toolbar height changes)
    let w = innerWidth, t;
    const onResize = () => {
      if (innerWidth === w) return; w = innerWidth;
      clearTimeout(t);
      t = setTimeout(() => { ctx.revert(); reset(); ctx = gsap.context(build); ScrollTrigger.refresh(); }, 200);
    };
    addEventListener("resize", onResize);
    return () => { removeEventListener("resize", onResize); clearTimeout(t); ctx.revert(); reset(); };
  });
  // Reduced motion: no pinning, just show every final layout
  mm.add("(prefers-reduced-motion: reduce)", () => {
    document.querySelectorAll("[data-gallery]").forEach((g) => g.classList.add("is-final"));
    return () => document.querySelectorAll("[data-gallery]").forEach((g) => g.classList.remove("is-final"));
  });
</script>
</body>
</html>
